<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- ブラウザのタブに表示される名前です -->
  <title>ここに作品のタイトル</title>
  <!-- 見た目（色や文字の大きさ）は css フォルダの style.css に書きます -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== ファーストビュー（最初に目に入る部分） ===== -->
  <header class="hero">
    <h1>キャッチコピーをここに</h1>
    <p>サブコピー（説明文）をここに</p>
    <a class="button" href="#contact">お問い合わせはこちら</a>
  </header>

  <!-- ===== 特徴・サービス紹介 ===== -->
  <section class="section">
    <h2>特徴</h2>
    <p>ここに紹介文を書きます。</p>
  </section>

  <!-- ===== お問い合わせ ===== -->
  <section class="section" id="contact">
    <h2>お問い合わせ</h2>
    <p>連絡先などをここに書きます。</p>
  </section>

  <footer class="footer">
    <small>&copy; 2026 サイト名</small>
  </footer>

</body>
</html>
